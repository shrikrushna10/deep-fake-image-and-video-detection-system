services:
  - type: web
    name: deepfake-detection-system
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python create_samples.py"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
